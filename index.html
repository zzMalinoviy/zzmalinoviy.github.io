<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Специально для тебя ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }
        .theme-pink {
            background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 50%, #f43f5e 100%);
        }
        .theme-purple {
            background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #7e22ce 100%);
        }
        .theme-mint {
            background: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 50%, #0d9488 100%);
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .floating-element {
            position: absolute;
            bottom: -50px;
            animation: floatUp 4s infinite linear;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body id="body-bg" class="theme-pink min-h-screen flex items-center justify-center p-4 transition-colors duration-500 relative">

    <!-- Плавающий фон -->
    <div id="background-decorations" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <!-- Основной контейнер -->
    <div id="app" class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center transition-all duration-300 relative z-10">
        <!-- Контент -->
    </div>

    <script>
        let currentTheme = 'theme-pink';
        let currentStep = -1; // -1: тема, 0: имя, 1-3: вопросы, 4: слайдер милоты, 5: мини-игра, 6: финал
        let userName = 'Принцесса';
        let gameScore = 0;
        let noClicks = 0;

        // ⚠️ ЗАМЕНИ 'bezonium' НА СВОЙ ТЕЛЕГРАМ ЛОГИН (без @)
        const myTelegramUsername = 'bezonov';

        const themes = [
            { id: 'theme-pink', name: 'Розовая 🌸', bgClass: 'bg-pink-400' },
            { id: 'theme-purple', name: 'Космос 🌌', bgClass: 'bg-purple-500' },
            { id: 'theme-mint', name: 'Мята 🍃', bgClass: 'bg-teal-400' }
        ];

        const questions = [
            {
                question: "Какое у тебя сегодня настроение?",
                options: ["Просто супер ✨", "Загадочное 🌙", "Хочу вкусняшку 🍩"]
            },
            {
                question: "Ты веришь в сюрпризы?",
                options: ["ДАААААА 🎉", "Если он от тебя, то да 😎", "Абсолютно 💕"]
            },
            {
                question: "Ты улыбнулась, пока читала это?",
                options: ["Даже не сомневайся 😌", "Ну чуть-чуть 🤭", "Конечно да! ✨"]
            }
        ];

        function initBackground() {
            const container = document.getElementById('background-decorations');
            container.innerHTML = '';
            const emojis = ['✨', '💖', '🌸', '⭐', '💫'];
            for (let i = 0; i < 8; i++) {
                const el = document.createElement('div');
                el.className = 'floating-element text-xl sm:text-2xl';
                el.style.left = `${Math.random() * 100}%`;
                el.style.animationDelay = `${Math.random() * 4}s`;
                el.style.animationDuration = `${3 + Math.random() * 3}s`;
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                container.appendChild(el);
            }
        }

        function setTheme(themeId) {
            currentTheme = themeId;
            document.getElementById('body-bg').className = `${currentTheme} min-h-screen flex items-center justify-center p-4 transition-colors duration-500 relative`;
            currentStep = 0;
            render();
        }

        function setUserName(name) {
            if (name.trim()) userName = name.trim();
            currentStep = 1;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            app.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                if (currentStep === -1) {
                    app.innerHTML = `
                        <div class="text-4xl mb-3">🎨</div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">Выбери стиль сайта</h1>
                        <p class="text-sm text-gray-500 mb-6">Создай своё настроение</p>
                        <div class="space-y-3">
                            ${themes.map(t => `<button onclick="setTheme('${t.id}')" class="w-full py-3 px-4 ${t.bgClass} hover:opacity-90 text-white font-semibold rounded-2xl shadow-md transition-all active:scale-95 text-lg">${t.name}</button>`).join('')}
                        </div>
                    `;
                } else if (currentStep === 0) {
                    app.innerHTML = `
                        <div class="text-4xl mb-3">✨</div>
                        <h1 class="text-xl font-bold text-gray-800 mb-2">Как к тебе обращаться?</h1>
                        <p class="text-sm text-gray-500 mb-6">Введи имя или оставь как есть</p>
                        <input type="text" id="name-input" value="${userName}" class="w-full px-4 py-3 bg-gray-100 rounded-2xl text-center text-gray-800 font-semibold mb-4 outline-none border-2 border-transparent focus:border-rose-400 text-lg">
                        <button onclick="setUserName(document.getElementById('name-input').value)" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-lg">Погнали! 🚀</button>
                    `;
                } else if (currentStep >= 1 && currentStep <= 3) {
                    const qIndex = currentStep - 1;
                    const q = questions[qIndex];
                    app.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Вопрос ${currentStep} из 3, ${userName}</span>
                            <button onclick="currentStep=-1; render();" class="text-xs text-gray-400 hover:text-gray-600 underline">Сбросить</button>
                        </div>
                        <h1 class="text-xl font-bold text-gray-800 mb-6 leading-snug">${q.question}</h1>
                        <div class="space-y-3">
                            ${q.options.map(opt => `<button onclick="nextStep()" class="w-full py-3.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-2xl shadow-sm transition-all active:scale-95 text-base">${opt}</button>`).join('')}
                        </div>
                    `;
                } else if (currentStep === 4) {
                    app.innerHTML = `
                        <div class="text-4xl mb-2">🥰</div>
                        <h1 class="text-xl font-bold text-gray-800 mb-2">Измеряем уровень милоты</h1>
                        <p id="slider-text" class="text-sm text-rose-500 font-semibold mb-4">100%+ — Абсолютный максимум милоты! 🌸</p>
                        <input type="range" min="1" max="100" value="100" class="w-full accent-rose-500 mb-6 cursor-pointer" oninput="updateSliderText(this.value)">
                        <button onclick="nextStep()" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-lg">Далее ✨</button>
                    `;
                } else if (currentStep === 5) {
                    gameScore = 0;
                    app.innerHTML = `
                        <div class="text-3xl mb-1">🎮</div>
                        <h1 class="text-lg font-bold text-gray-800 mb-1">Мини-игра для ${userName}!</h1>
                        <p class="text-xs text-gray-500 mb-3">Тапай по сердечкам (нужно 5 очков)</p>
                        <div class="flex justify-between text-sm font-bold text-rose-500 mb-2 px-2">
                            <span>Очки: <span id="score-val">0</span>/5</span>
                            <span>⏱ <span id="time-val">8</span>с</span>
                        </div>
                        <div id="game-area" class="h-48 bg-gray-50 rounded-2xl relative overflow-hidden border border-gray-200 mb-4 cursor-pointer">
                            <div class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm select-none" id="game-prompt">Нажми «Старт»!</div>
                        </div>
                        <button id="start-game-btn" onclick="startGame()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-base">Начать игру 🎯</button>
                    `;
                } else {
                    noClicks = 0;
                    app.innerHTML = `
                        <div class="text-6xl mb-4 animate-bounce">🎁</div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Ну что, ${userName}, хочешь подарок?</h1>
                        <p class="text-xs text-gray-500 mb-6">Выбор за тобой 😉</p>
                        <div class="flex gap-3 justify-center items-center">
                            <button id="yes-btn" onclick="handleYes()" class="flex-1 py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95 text-lg">Да 💖</button>
                            <button id="no-btn" onclick="handleNoClick()" class="py-3.5 px-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95 text-lg origin-center">Нет 🙈</button>
                        </div>
                    `;
                }

                app.classList.remove('opacity-0', 'scale-95');
            }, 150);
        }

        function nextStep() {
            currentStep++;
            render();
        }

        function updateSliderText(val) {
            const textEl = document.getElementById('slider-text');
            if (val < 30) textEl.innerText = `${val}% — Подожди, тут ошибка! 😉`;
            else if (val < 70) textEl.innerText = `${val}% — Уже тепло ❤️`;
            else if (val < 100) textEl.innerText = `${val}% — Очень-очень мило ✨`;
            else textEl.innerText = `100%+ — Абсолютный максимум милоты! 🌸`;
        }

        function startGame() {
            const gameArea = document.getElementById('game-area');
            const prompt = document.getElementById('game-prompt');
            const startBtn = document.getElementById('start-game-btn');
            prompt.style.display = 'none';
            startBtn.style.display = 'none';
            gameScore = 0;
            let timeLeft = 8;
            document.getElementById('score-val').innerText = gameScore;
            document.getElementById('time-val').innerText = timeLeft;

            const spawnInterval = setInterval(() => {
                if (timeLeft <= 0) return;
                const heart = document.createElement('div');
                heart.className = 'absolute text-3xl cursor-pointer transition-transform transform hover:scale-125 active:scale-95';
                heart.innerHTML = '💖';
                
                const maxX = gameArea.clientWidth - 40;
                const maxY = gameArea.clientHeight - 40;
                heart.style.left = `${Math.max(10, Math.random() * maxX)}px`;
                heart.style.top = `${Math.max(10, Math.random() * maxY)}px`;

                heart.onmousedown = heart.ontouchstart = (e) => {
                    e.stopPropagation();
                    gameScore++;
                    document.getElementById('score-val').innerText = gameScore;
                    heart.remove();
                    if (gameScore >= 5) {
                        clearInterval(spawnInterval);
                        clearInterval(timerInterval);
                        setTimeout(nextStep, 500);
                    }
                };

                gameArea.appendChild(heart);
                setTimeout(() => { if (heart.parentElement) heart.remove(); }, 1200);
            }, 350);

            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(spawnInterval);
                    clearInterval(timerInterval);
                    if (gameScore < 5) {
                        showTimeoutModal();
                    }
                }
            }, 1000);
        }

        function showTimeoutModal() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="text-5xl mb-3">🤭</div>
                <h1 class="text-xl font-bold text-gray-800 mb-3">Время вышло!</h1>
                <p class="text-gray-600 text-sm mb-6">Будем считать что ты на все нажала)))))</p>
                <button onclick="nextStep()" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-lg">Идти дальше ✨</button>
            `;
        }

        function handleNoClick() {
            noClicks++;
            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            
            if (noClicks === 1) {
                noBtn.innerText = "Точно? 🥺";
                noBtn.style.transform = "scale(0.85)";
                yesBtn.style.flex = "1.5";
            } else if (noClicks === 2) {
                noBtn.innerText = "Уверенна? 🤔";
                noBtn.style.transform = "scale(0.65)";
                yesBtn.style.flex = "2";
            } else if (noClicks === 3) {
                noBtn.innerText = "Ну всё...";
                noBtn.style.transform = "scale(0.4)";
                yesBtn.style.flex = "3";
            } else {
                showOppositeDayModal();
            }
        }

        function showOppositeDayModal() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="text-6xl mb-4">😜</div>
                <h1 class="text-xl font-bold text-gray-800 mb-3">Айайай, а вот сегодня день наоборот бебебебе</h1>
                <p class="text-gray-600 text-sm mb-6">А вот нечего отказываться, расстраиваешь меня 😉</p>
                <button onclick="handleYes()" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-lg">Забрать подарок 🎉</button>
            `;
        }

        function handleYes() {
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="text-6xl mb-4 animate-pulse">👑</div>
                <h1 class="text-2xl font-bold text-gray-800 mb-3">Я и не сомневался, ${userName}</h1>
                <p class="text-gray-600 text-sm mb-6">Этот сюрприз полностью твой! Заслужила на все 100% 😉</p>
                <button onclick="sendToTelegram()" class="w-full py-3.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-2xl shadow-md transition-all active:scale-95 text-lg mb-3">Забрать подарок 🚀</button>
                <button onclick="currentStep=-1; render();" class="text-xs text-gray-400 hover:text-gray-600 underline">Пройти заново</button>
            `;
        }

        // Функция открытия Telegram с заготовленным текстом
        function sendToTelegram() {
            const message = encodeURIComponent("хочу подарок");
            const telegramUrl = `https://t.me/${myTelegramUsername}?text=${message}`;
            window.location.href = telegramUrl;
        }

        initBackground();
        render();
    </script>
</body>
</html>
